# The Lenovo 83HX's UCM profile offers a dead "Digital Microphone" and ties the working built-in
# mic to the empty headset jack, so WirePlumber never picks it. The plain HDA profile gets it right.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_04_00.6"
      }
    ]
    actions = {
      update-props = {
        api.alsa.use-ucm = false
      }
    }
  }
]
